apiVersion: batch/v1
kind: Job
metadata:
  name: create-db
spec:
  template:
    spec:
      containers:
      - name: createdb
        image: postgres:15
        env:
        - name: PGPASSWORD
          value: postgres
        command: ["psql"]
        args:
          ["-h", "postgres", "-U", "postgres", "-c", "CREATE DATABASE imv;"]
      restartPolicy: Never
