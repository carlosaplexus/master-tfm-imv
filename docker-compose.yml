version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: imv-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: imv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: imv-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/imv
    ports:
      - "5001:5001"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: imv-frontend
    environment:
      BACKEND_URL: http://localhost:5001
    ports:
      - "5000:5000"
    depends_on:
      - backend

volumes:
  postgres_data:
