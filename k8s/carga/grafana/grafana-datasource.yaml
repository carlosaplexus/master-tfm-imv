apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: imv-simulacion
  labels:
    grafana_datasource: "1"
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
    - name: InfluxDB
      type: influxdb
      access: proxy
      url: http://influxdb:8086
      database: k6
      isDefault: true
      uid: influxdb-k6
